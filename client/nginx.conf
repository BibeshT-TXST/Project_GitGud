server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- Serve the SPA ----------
    # Try the exact file first; if not found, fall back to index.html
    # so React Router can handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- Reverse-proxy API calls ----------
    # Request to /api/* is forwarded to the backend container.
    # The "rewrite" strips the /api prefix before forwarding.
    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://backend-server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
