services:
  inventory-db:            # This is the service name (internal to Compose)
    build: .               # Replaces 'docker build -t db-inventory .'
    image: db-inventory    # Names the built image 'db-inventory'
    container_name: db-container  # Replaces '--name db-container'
    ports:
      - "5432:5432"        # Replaces '-p 5432:5432'
    volumes:
      - db-volume:/var/lib/postgresql/data # Replaces '-v db-volume:...'

volumes:
  db-volume:               # This tells Compose to manage the 'db-volume'