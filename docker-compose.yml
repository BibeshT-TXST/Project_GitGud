services:
  # -------- PostgreSQL Database --------
  inventory-db:
    build: ./database           # Uses database/Dockerfile
    image: db-inventory
    container_name: db-container
    ports:
      - "5432:5432"
    volumes:
      - db-volume:/var/lib/postgresql/data

  # -------- Express.js Backend API --------
  backend-server:
    build: ./server             # Uses server/Dockerfile
    image: backend-server
    container_name: server-container
    ports:
      - "5000:5000"
      
    environment:
      - DB_USER : ${{ secrets.DB_USER}}
      - DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      - DB_HOST: ${{ secrets.DB_HOST }}
      - DB_PORT: ${{ secrets.DB_PORT }}
      - DB_NAME: ${{ secrets.DB_NAME }}
      - JWT_SECRET: ${{ secrets.JWT_SECRET }}
      - PEPPER_SECRET: ${{ secrets.PEPPER_SECRET }}

    depends_on:
      - inventory-db            # Ensures DB starts before the server
    restart: on-failure         # Auto-restart if the server crashes

  # -------- React Frontend (Nginx) --------
  frontend-client:
    build: ./client              # Uses client/Dockerfile
    image: frontend-client
    container_name: client-container
    ports:
      - "3000:80"                # Maps host port 3000 → Nginx port 80
    depends_on:
      - backend-server           # Ensures backend starts before the frontend
    restart: on-failure
    
volumes:
  db-volume:
